<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Informe · Rastro ID</title>
  <link rel="icon" href="../icons/icon32.png">
  <style>
    html, body { margin: 0; height: 100%; background: #525659; font: 13px system-ui, "Segoe UI", sans-serif; }
    .bar {
      position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 16px; background: #0f1722; color: #e3e9f1; border-bottom: 1px solid #24344a;
    }
    .bar b { color: #f0c419; }
    .bar .sp { flex: 1; }
    .bar button { font: inherit; cursor: pointer; border-radius: 6px; padding: 7px 12px; border: 1px solid #24344a; background: transparent; color: #e3e9f1; }
    .bar button.primary { background: #f0c419; color: #231a00; border: 0; font-weight: 600; }
    #info { color: #8a9bb2; font-size: 12px; }
    #hash { font: 11px ui-monospace, Consolas, monospace; color: #8a9bb2; word-break: break-all; }
    .sheet { max-width: 900px; margin: 18px auto 40px; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.35); }
    iframe { display: block; width: 100%; border: 0; min-height: 80vh; background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <img src="../icons/logo-rastro-id-banner.png" alt="Rastro ID" style="height:34px;border-radius:4px"><span>Rastro <b>ID</b> · Informe</span>
    <span id="info"></span>
    <span class="sp"></span>
    <button id="print" class="primary">Imprimir / Guardar PDF</button>
    <button id="dlHtml">Descargar HTML</button>
    <button id="dlTxt">Descargar TXT</button>
  </div>
  <div class="bar" style="padding-top:0;border-bottom:0"><span id="hash"></span></div>
  <div class="sheet"><iframe id="doc" title="Informe"></iframe></div>
  <script type="module" src="report.js"></script>
</body>
</html>
